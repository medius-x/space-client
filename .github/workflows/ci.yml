# CI: the developer gate (typecheck + vitest + electron-vite build) on every
# push to main and every PR. Node 24 to match the dev machine; the tests are
# node-environment (no display needed), the build bundles without launching
# Electron.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
