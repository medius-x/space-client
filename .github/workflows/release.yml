# Release: a pushed v* tag builds BOTH Windows NSIS installers and attaches
# them to a GitHub Release.
#
# Two artifacts, one version (user decision 2026-11-02):
#   - SPACE-Setup-<v>.exe (light, ~50 MB) — the DEFAULT download; the server
#     kit is fetched at provisioning time (the server pulls from GitHub, the
#     client relays over SFTP as the fallback). Update feed: latest.yml.
#   - SPACE-Full-Bundled-Setup-<v>.exe (full-bundled, ~700 MB) — the offline
#     variant with the jar + the six docker-image archives bundled (user
#     decision 2026-10-13, kept as this variant's own promise). Update feed:
#     full-bundled.yml (electron-updater's canonical <channel>.yml).
#
# The kit pieces come from the oak-server release of the SAME tag. The image
# archives are too big for git: `npm run images:sync` builds them on the dev
# machine and `npm run images:publish` attaches them to the oak-server release
# of this tag BEFORE this workflow runs (manual web upload works too). A
# missing asset fails the version-pairing step below with a pointed message.
#
# How to release:
#   1. bump <version> in pom.xml (oak-server) AND package.json here to the
#      same value, commit both repos
#   2. tag oak-server v0.4.0 and push → its workflow publishes the jar
#   3. on the dev machine: npm run images:publish -- v0.4.0 (attach the image
#      archives to that oak-server release)
#   4. tag THIS repo v0.4.0 and push → both installers land in this release
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Version gate — tag must match package.json
        shell: pwsh
        run: |
          $tagVersion = "${env:GITHUB_REF_NAME}".TrimStart('v')
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          Write-Host "tag=${tagVersion} package.json=${packageVersion}"
          if ($tagVersion -ne $packageVersion) {
            Write-Error "tag ${env:GITHUB_REF_NAME} does not match package.json version ${packageVersion} — bump package.json to ${tagVersion} and re-tag"
            exit 1
          }

      - name: Config equivalence gate — the two builders must not drift
        # electron-builder-full-bundled.yml duplicates the base config on
        # purpose (only extraResources/channel/artifactName may differ). This
        # gate fails the release when a critical field changes in ONE file —
        # a silent drift would break one of the two update channels.
        shell: pwsh
        run: |
          $critical = @(
            'appId: oak.space',
            'productName: SPACE',
            'provider: github',
            'owner: medius-x',
            'repo: space-client',
            'npmRebuild: false',
            'node_modules/koffi/**',
            'oneClick: true'
          )
          foreach ($line in $critical) {
            foreach ($file in @('electron-builder.yml', 'electron-builder-full-bundled.yml')) {
              if (-not (Select-String -Path $file -SimpleMatch $line -Quiet)) {
                Write-Error "$file is missing the critical line '$line' — the two builder configs drifted apart"
                exit 1
              }
            }
          }

      - run: npm ci

      - name: Fetch the server kit of this version from the oak-server release
        shell: pwsh
        env:
          SERVER_REPO: ${{ github.repository_owner }}/oak-server
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = "${env:GITHUB_REF_NAME}"
          $dest = "electron/provisioning/files"
          New-Item -ItemType Directory -Force -Path "$dest/images" | Out-Null
          # manifest.json lists FLAT archive names ("postgres.tar.gz") — images:publish
          # uploads them under exactly those asset names, so the download URL is flat
          # too; only the DESTINATION differs (jar → files/, archives → files/images/).
          $jarAsset = "oak-server.jar"
          $archives = Get-Content "$dest/images/manifest.json" -Raw | ConvertFrom-Json | ForEach-Object { $_.archive }
          foreach ($asset in @($jarAsset) + @($archives)) {
            $url = "https://github.com/${env:SERVER_REPO}/releases/download/${tag}/${asset}"
            $out = if ($asset -eq $jarAsset) { "$dest/$asset" } else { "$dest/images/$asset" }
            Write-Host "fetching $url"
            & curl.exe -fsSL --retry 3 -o $out "$url"
            if ($LASTEXITCODE -ne 0) {
              Write-Error "asset ${asset} is missing from the oak-server release ${tag} — run 'npm run images:publish -- ${tag}' on the dev machine (or upload the archives to that release) and re-run this workflow"
              exit 1
            }
          }

      - name: Build the FULL-BUNDLE installer
        # First the heavy build, WITH the whole kit in the tree. --publish
        # never: this workflow uploads the artifacts itself; the flag still
        # emits the full-bundled.yml feed and the blockmap next to the exe.
        run: npm run dist:full -- --publish never

      - name: Stage the full-bundled artifacts away
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart('v')
          New-Item -ItemType Directory -Force -Path release-full | Out-Null
          foreach ($file in @(
            "release/SPACE Full Bundled Setup $version.exe",
            "release/SPACE Full Bundled Setup $version.exe.blockmap",
            "release/full-bundled.yml"
          )) {
            if (-not (Test-Path $file)) { Write-Error "missing full-bundled artifact: $file"; exit 1 }
            Move-Item $file "release-full/" -Force
          }
          # The second electron-builder run must not mistake the staged
          # artifacts (or the unpacked dirs) for its own.
          Remove-Item -Recurse -Force release | Out-Null

      - name: Strip the kit for the LIGHT build
        # manifest.json STAYS — it is the digest-pin source of the light
        # ladder; only the heavy binaries go.
        shell: pwsh
        run: |
          Remove-Item -Force "electron/provisioning/files/oak-server.jar" -ErrorAction SilentlyContinue
          Remove-Item -Force "electron/provisioning/files/images/*.tar.gz" -ErrorAction SilentlyContinue
          if (Test-Path "electron/provisioning/files/oak-server.jar") { Write-Error "the jar is still present — the light build would bundle it"; exit 1 }

      - name: Build the LIGHT installer
        # The default artifact + the default latest.yml feed.
        run: npm run dist -- --publish never

      - name: Publish both installers to the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${env:GITHUB_REF_NAME}"
          $version = $tag.TrimStart('v')
          # electron-builder writes DASHED names into the update feeds
          # ("SPACE-Setup-<version>.exe", "SPACE-Full-Bundled-Setup-<version>.exe");
          # GitHub asset names must match those EXACTLY or the updater's
          # download 404s — so the local files (built with spaces) are mirrored
          # to the canonical names before upload. Both feeds + blockmaps ride
          # along — they ARE what electron-updater consumes.
          $lightExe = "release/SPACE-Setup-$version.exe"
          Copy-Item "release/SPACE Setup $version.exe" $lightExe -Force
          Copy-Item "release/SPACE Setup $version.exe.blockmap" "$lightExe.blockmap" -Force
          $fullExe = "release-full/SPACE-Full-Bundled-Setup-$version.exe"
          Copy-Item "release-full/SPACE Full Bundled Setup $version.exe" $fullExe -Force
          Copy-Item "release-full/SPACE Full Bundled Setup $version.exe.blockmap" "$fullExe.blockmap" -Force
          $artifacts = @(
            $lightExe, "$lightExe.blockmap", "release/latest.yml",
            $fullExe, "$fullExe.blockmap", "release-full/full-bundled.yml"
          )
          foreach ($artifact in $artifacts) {
            if (-not (Test-Path $artifact)) { Write-Error "missing release artifact: $artifact"; exit 1 }
          }
          # The feeds must reference the dashed names they will be served
          # under — a mismatch means a 404 on every future update check.
          if (-not (Select-String -Path "release/latest.yml" -SimpleMatch "SPACE-Setup-$version.exe" -Quiet)) {
            Write-Error "latest.yml does not reference SPACE-Setup-$version.exe"; exit 1
          }
          if (-not (Select-String -Path "release-full/full-bundled.yml" -SimpleMatch "SPACE-Full-Bundled-Setup-$version.exe" -Quiet)) {
            Write-Error "full-bundled.yml does not reference SPACE-Full-Bundled-Setup-$version.exe"; exit 1
          }
          # Release notes: a handwritten changelog lives at release-notes/v<version>.md
          # (see that directory's README) and becomes the release body; without one the
          # release falls back to GitHub's auto-generated commit list.
          $notesFile = "release-notes/v$version.md"
          if (Test-Path $notesFile) {
            gh release create "$tag" $artifacts --title "$tag" --notes-file $notesFile --verify-tag `
              || gh release upload "$tag" $artifacts --clobber
          } else {
            gh release create "$tag" $artifacts --title "$tag" --generate-notes --verify-tag `
              || gh release upload "$tag" $artifacts --clobber
          }
