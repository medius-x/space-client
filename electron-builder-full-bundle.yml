# electron-builder config — the FULL-BUNDLE installer (user decision
# 2026-11-02): the SAME app as electron-builder.yml but with the whole server
# kit bundled (oak-server.jar + the six docker-image archives, ~610 MB) —
# the offline-capable variant: a fresh VPS can be provisioned with NO access to
# GitHub or registries at all (user decision 2026-10-13, kept as the bundle's
# own promise). Keep this file in sync with electron-builder.yml — the release
# workflow asserts the critical fields match (the differences are exactly:
# extraResources without the light filter, the full kit marker, the
# full-bundle channel and the artifact name).
#
# Build: npm run dist:full. The release workflow builds BOTH installers into
# the same GitHub Release, each with its own update feed.
appId: oak.space
productName: SPACE

directories:
  output: release
  buildResources: electron/build

files:
  - out/**

npmRebuild: false
asarUnpack:
  - node_modules/koffi/**

# The full-bundle update channel: electron-builder writes `channel:
# full-bundle` into this artifact's app-update.yml, so electron-updater asks
# for full-bundle.yml (the canonical <channel>.yml name) — a full-bundle
# install updates full-bundle, a light install updates light, neither ever
# crosses over. Same GitHub repo as the default feed.
publish:
  provider: github
  owner: medius-x
  repo: space-client
  channel: full-bundle

extraResources:
  # The whole kit: templates + manifest.json + the jar + the six image
  # archives (fetched into this tree by the release workflow before the build;
  # a local build needs npm run jar:sync + images:sync first).
  - from: electron/provisioning/files
    to: provisioning/files
  # The kit marker — "full": the terminal stage may deploy from the bundled
  # archives, and the failure texts stay honest to the offline promise.
  - from: electron/provisioning/kit-full.json
    to: provisioning/files/kit.json
  # The tray icon — the only icon the exe resource cannot provide (Tray needs a
  # file path; createTray reads resources/build/icon-48.png when packaged).
  - from: electron/build/icon-48.png
    to: build/icon-48.png
  # License texts for the bundled docker images (see THIRD-PARTY-NOTICES.md) —
  # redistribution notices must ride with the artifacts they cover.
  - from: licenses
    to: licenses

win:
  target: nsis
  icon: electron/build/icon.png

nsis:
  oneClick: true
  # The default per-user install needs no UAC elevation — the app writes nothing
  # outside its own directories (userData for KV/logs, temp for provisioning).
  perMachine: false
  # The dashed mirror of this name is what the feed references.
  artifactName: "SPACE Full Bundle Setup ${version}.exe"
