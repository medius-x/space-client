# OAK — PRODUCTION compose, deployed by the client's provisioning flow (round C).
#
# DERIVED FROM oak-server/env/docker-compose.yml — keep the two in sync when a
# service/env/volume changes there. The deliberate differences from the dev file:
#   - NO `profiles`: a deployment starts EVERYTHING with a plain `docker compose up -d`
#     (the dev file hides oak+caddy behind `--profile full` because the dev machine
#     runs oak on the host).
#   - NO host port mappings for the periphery (postgres 5432, minio 9000/9001,
#     janus 8088/8188/7088): those stay INSIDE the compose network — Caddy is the
#     only public HTTP surface. The dev topology maps them for a host-run oak.
#   - Still host-mapped: Caddy 443/9443, coturn's ports, and Janus's RTP media
#     range (2000-2300/udp — 301 ports ≈ 150 voice streams, ample for a 2 GB
#     VPS; a wider range makes dockerd fork one iptables rule PER PORT and the
#     start dies at fork under memory pressure, live 2026-10-13) — client
#     WebRTC endpoints send SRTP straight at the host, bypassing every proxy.
# Variables come from /opt/oak/.env (generated by the provisioning flow with
# per-deployment random secrets — never the dev defaults).

services:

  # ───────────────────────────── PostgreSQL ─────────────────────────────
  postgres:
    image: postgres@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    container_name: oak-postgres
    restart: unless-stopped
    # Slow-query logging mirrors the dev compose; bind-parameter VALUES stay
    # disabled (message texts and invite secrets must not leak into logs).
    command: ["postgres", "-c", "log_min_duration_statement=200ms", "-c", "log_parameter_max_length=0"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - oak-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────── MinIO ──────────────────────────────
  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: oak-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - oak-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────── MinIO bootstrap (one-shot) ──────────────────
  # Creates the scoped app user oak-server signs/uploads with (bucket-only
  # policy, no admin). Idempotent — safe on every `docker compose up`.
  minio-init:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}
        echo '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Action":["s3:CreateBucket"],"Resource":["arn:aws:s3:::*"]},{"Effect":"Allow","Action":["s3:ListBucket","s3:GetBucketLocation"],"Resource":["arn:aws:s3:::oak-attachments"]},{"Effect":"Allow","Action":["s3:*"],"Resource":["arn:aws:s3:::oak-attachments/*"]}]}' > /tmp/oak-app-policy.json
        mc admin policy create local oak-app /tmp/oak-app-policy.json || true
        mc admin user add local ${MINIO_APP_USER} ${MINIO_APP_PASSWORD}
        mc admin policy attach local oak-app --user ${MINIO_APP_USER} || true
        echo "[minio-init] app user ${MINIO_APP_USER} ready (bucket-only policy)"

  # ──────────────────────────────── Janus ──────────────────────────────
  # Locally built image (token_auth + runtime admin secret — see janus/Dockerfile
  # next to this compose file). The Admin API stays inside the compose network;
  # only the RTP media range is host-mapped for client WebRTC endpoints.
  janus:
    build: ./janus
    image: oak-janus:secured
    container_name: oak-janus
    restart: unless-stopped
    environment:
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET}
      # Rewrites Janus host candidates to the public IP (see nat_1_1_mapping in
      # janus/janus.jcfg): the RTP range is published 1:1, so the public address
      # is the only wrong part of the container's own candidate. TURN_EXTERNAL_IP
      # is always the raw public IP in this .env.
      NAT_1_1_IP: ${TURN_EXTERNAL_IP}
    ports:
      # RTP media range — must match rtp_port_range in janus.jcfg (janus
      # allocates RTP/RTCP pairs from it; clients send SRTP straight at the
      # host IP).
      - "2000-2300:2000-2300/udp"

  # ──────────────────────────────── Coturn ─────────────────────────────
  # TURN/STUN for 1-on-1 calls behind strict NAT. REST-API credentials
  # (time-boxed tickets oak-server signs with TURN_STATIC_AUTH_SECRET).
  coturn:
    image: coturn/coturn@sha256:0c0e8fc0c263b85a134e9e4242b5e46e1f4c077c5029633511191c05b5c2c814
    container_name: oak-coturn
    restart: unless-stopped
    entrypoint: ["turnserver"]
    command:
      - --realm=${TURN_REALM}
      - --server-name=${TURN_REALM}
      - --listening-ip=0.0.0.0
      - --external-ip=${TURN_EXTERNAL_IP}
      - --use-auth-secret
      - --static-auth-secret=${TURN_STATIC_AUTH_SECRET}
      - --min-port=${TURN_MIN_PORT}
      - --max-port=${TURN_MAX_PORT}
      - --fingerprint
      - --no-multicast-peers
      - --no-cli
      - --log-file=stdout
    ports:
      - "${TURN_LISTEN_PORT:-34780}:3478/tcp"
      - "${TURN_LISTEN_PORT:-34780}:3478/udp"
      - "${TURN_TLS_PORT:-5349}:5349/tcp"
      - "${TURN_TLS_PORT:-5349}:5349/udp"
      # Relay range — keep in sync with TURN_MIN_PORT/TURN_MAX_PORT.
      - "${TURN_MIN_PORT:-55000}-${TURN_MAX_PORT:-55050}:${TURN_MIN_PORT:-55000}-${TURN_MAX_PORT:-55050}/udp"

  # ──────────────────────────── oak-server ─────────────────────────────
  # The Spring Boot server (prod profile: every secret must come from .env).
  # NEVER host-maps 8080 — Caddy is the only public HTTP surface.
  oak:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: oak-server:local
    container_name: oak-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      SPRING_PROFILES_ACTIVE: prod
      # A 2 GB VPS OOM-killed the stack on start (live 2026-10-12): without a
      # limit the JVM sizes itself off the HOST's memory and the parallel
      # container start tips the box over. 512 MB heap + 200 MB metaspace is
      # ample for this single-tenant server.
      JAVA_TOOL_OPTIONS: "-Xmx512m -XX:MaxMetaspaceSize=200m -Xss512k"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-oak}
      POSTGRES_USER: ${POSTGRES_USER:-oak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?generate one in /opt/oak/.env}
      JWT_SECRET: ${JWT_SECRET:?generate one (openssl rand -hex 32) in /opt/oak/.env}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: https://${OAK_PUBLIC_HOST:-localhost}:${OAK_MINIO_HTTPS_PORT:-9443}
      MINIO_APP_USER: ${MINIO_APP_USER:-oak_app}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?set in /opt/oak/.env}
      JANUS_REST_URL: http://janus:8088/janus
      JANUS_PUBLIC_REST_URL: https://${OAK_PUBLIC_HOST:-localhost}:${OAK_HTTPS_PORT:-443}/janus
      JANUS_ADMIN_URL: http://janus:7088/admin
      JANUS_ADMIN_SECRET: ${JANUS_ADMIN_SECRET:?set in /opt/oak/.env}
      TURN_HOST: ${OAK_PUBLIC_HOST:-localhost}
      TURN_LISTEN_PORT: ${TURN_LISTEN_PORT:-34780}
      TURN_STATIC_AUTH_SECRET: ${TURN_STATIC_AUTH_SECRET:?set in /opt/oak/.env}
      TURN_REALM: ${TURN_REALM:-oak.local}
    volumes:
      # The rolling file log (read by GET /api/server/logs) survives re-creates.
      - oak-server-logs:/root/.oak-server

  # ─────────────────────── Caddy TLS entry point ───────────────────────
  # Terminates TLS and routes: https://<host> → oak (REST + /ws) with /janus*
  # → janus, https://<host>:9443 → MinIO. Certificate: files from ./caddy/certs
  # (self-signed; the provisioning flow generates them) — the `tls` lines carry
  # the "provisioning:tls-file" marker, which the client strips for DOMAIN
  # deployments so Caddy obtains a Let's Encrypt certificate automatically.
  caddy:
    image: caddy@sha256:f2a1290d0463aad60660d4ec134943f183ee2a5f6c3eb7bf32dd984f2f020772
    container_name: oak-caddy
    restart: unless-stopped
    depends_on:
      - oak
      - janus
      - minio
    environment:
      OAK_SITE_ADDRESS: ${OAK_SITE_ADDRESS:-https://localhost}
      # The Caddyfile's default_sni reads this — .env vars reach the container
      # ONLY through this list (a bare {$OAK_PUBLIC_HOST} in the Caddyfile
      # resolves to nothing and caddy dies on config validation, live
      # 2026-10-13).
      OAK_PUBLIC_HOST: ${OAK_PUBLIC_HOST:-localhost}
      OAK_MINIO_SITE_ADDRESS: ${OAK_MINIO_SITE_ADDRESS:-https://localhost:9443}
      OAK_TLS_CERT: /certs/tls.crt
      OAK_TLS_KEY: /certs/tls.key
    ports:
      - "${OAK_HTTPS_PORT:-443}:443"
      - "${OAK_MINIO_HTTPS_PORT:-9443}:9443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/certs:/certs:ro
      - oak-caddy-data:/data
      - oak-caddy-config:/config

volumes:
  oak-postgres-data:
  oak-minio-data:
  oak-server-logs:
  oak-caddy-data:
  oak-caddy-config:
