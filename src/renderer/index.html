<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Dev-permissive CSP: vite HMR (localhost ws) + the local server stack. Tightened per-origin at packaging (M7).
       connect-src carries blob: — the attachment cache hands out blob: object URLs
       and the incoming-call card re-reads them with fetch() to mint a cross-window
       data: URL (a missing blob: read as a bare "Failed to fetch", live report).
       script-src/worker-src carry blob: — the noise-suppression engines build
       their AudioWorklet modules from blob: URLs (RNNoise glue inlined by us,
       DeepFilterNet3 inlines its own; without it addModule is blocked).
       script-src carries 'wasm-unsafe-eval' — WebAssembly compilation inside those
       worklets (RNNoise inlines its wasm as base64, DFN3 compiles a fetched module);
       the narrow WASM-only token, NOT the JS 'unsafe-eval' (live CompileError report). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; connect-src 'self' blob: http://localhost:* ws://localhost:*; media-src mediastream: blob: 'self' http://localhost:*; img-src 'self' data: blob:">
  <title>space</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./main.tsx"></script>
</body>
</html>
